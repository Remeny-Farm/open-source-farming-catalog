name: I built this / Megépítettem
description: Report a build of a listed design, with a photo. / Jelentés egy listázott terv megépítéséről, fotóval.
title: "[build] "
labels: ["submission", "build-report", "documentation", "manual", "triaged"]
body:
  - type: input
    id: project
    attributes:
      label: Project id / Projektazonosító
      description: The directory name under projects/, e.g. tin-can-cigarette-butt-collector. / A projects/ alatti könyvtár neve, például tin-can-cigarette-butt-collector.
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: Date built / Építés dátuma
      placeholder: "2026-10-01"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version you built / Megépített verzió
      description: As shown on the project's page or in project.json. / Ahogy a projekt oldalán vagy a project.json-ban szerepel.
  - type: textarea
    id: notes
    attributes:
      label: Problem / Probléma
      description: Tell us how the build went, even if nothing went wrong. Include printer or tools, material, what fit and what did not, and what you changed. / Írd le, hogyan sikerült az építés, akkor is, ha nem volt gond. Add meg a nyomtatót vagy a szerszámokat, az anyagot, mi illeszkedett és mi nem, és min változtattál.
    validations:
      required: true
  - type: textarea
    id: photo
    attributes:
      label: Evidence, photo of your build / Bizonyíték, fotó a megépített tárgyról
      description: Drag a photo of your build here (at least 1200 px wide). / Húzd ide a fotót (legalább 1200 px széles).
    validations:
      required: true
  - type: input
    id: credit
    attributes:
      label: Name to credit / Feltüntetendő név
    validations:
      required: true
  - type: checkboxes
    id: rights
    attributes:
      label: Rights / Jogok
      options:
        - label: The photo is mine and may be published under CC BY-SA 4.0 with the name above. / A fotó az enyém, és a fenti névvel CC BY-SA 4.0 alatt közzétehető.
          required: true
